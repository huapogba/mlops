services:

  mysql:
    image: mysql:8
    container_name: mysql-smart-camera_new
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: tan150823
      MYSQL_DATABASE: smart_camera

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - smart-net

  backend:
    image: yolo_env_full:latest
    container_name: adoring_ptolemy_new
    restart: always

    working_dir: /app

    # CHẠY PACKAGE PYTHON
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    depends_on:
      - mysql

    environment:
      DATABASE_URL: mysql+pymysql://root:tan150823@mysql:3306/smart_camera

    volumes:
      - .:/app

    networks:
      - smart-net

    # GPU SUPPORT
    gpus: all
  
  watcher:
    image: yolo_env_full:latest
    container_name: dvc-watcher
    restart: always

    working_dir: /app

    command: python -u backend/watcher.py

    volumes:
      - .:/app

    depends_on:
      - backend

    networks:
      - smart-net

    gpus: all

  mlflow:
    #image: yolo_env_full:latest
    image: ghcr.io/mlflow/mlflow
    container_name: mlflow-monitor_new
    restart: always

    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --allowed-hosts *
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlruns

    ports:
      - "5005:5000"

    expose: []

    volumes:
      - ./mlruns:/mlruns

    networks:
      - smart-net

  prometheus:
    image: prom/prometheus
    container_name: prometheus_new
    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - smart-net

  grafana:
    image: grafana/grafana
    container_name: grafana_new
    restart: always

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    networks:
      - smart-net

volumes:
  mysql_data:
  grafana_data:

networks:
  smart-net: